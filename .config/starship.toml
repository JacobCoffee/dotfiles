format = """
$kubernetes\
$directory\
$git_branch\
$git_status\
$package\
$python\
$bun\
$nodejs\
$rust\
$terraform\
$helm\
$docker_context\
$custom\
$direnv
$character"""

# Allow occasional slow directory scans without a large prompt delay.
scan_timeout = 100
command_timeout = 10000

# Right-side prompt with git metrics, time, and command duration
right_format = '$git_metrics$cmd_duration$time'

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Replace the "❯" symbol in the prompt with "➜"
[character] # The name of the module we are configuring is "character"
success_symbol = "[➜](bold green)" # The "success_symbol" segment is being set to "➜" with the color "bold green"
error_symbol = "[✗](bold red)"     # used if previous command failed

# Displays status of Git repository when in a directory of a Git repository
[git_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style)) '
added_style = 'italic dimmed green'
deleted_style = 'italic dimmed red'
disabled = false

[git_status]
format = '[$all_status$ahead_behind]($style) [│](dimmed white) '
conflicted = '[!](bold red)'
ahead = '[⇡${count}](green)'
diverged = '[⇡${ahead_count}⇣${behind_count}](yellow)'
behind = '[⇣${count}](red)'
up_to_date = '[✓](dimmed green)'
untracked = '[?](dimmed yellow)'
stashed = '[≡](dimmed cyan)'
modified = '[~](yellow)'
staged = '[+${count}](green)'
renamed = '[→](blue)'
deleted = '[x](red)'

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = '[🍒 PICKING](bold red)'

[git_commit]
commit_hash_length = 4
tag_symbol = '🔖 '

[os.symbols]
Macos = "🍎 "


[git_branch]
symbol = ' '
format = '[$symbol$branch]($style) '
truncation_length = 20
truncation_symbol = '…'
style = 'bold purple'
ignore_branches = ['master', 'main']


[directory]
read_only = " "
format = '[$path]($style)[$read_only]($read_only_style) [│](dimmed white)'

[kubernetes]
format = '[$symbol$context](bold $style) [│](dimmed white) '
symbol = '⎈ '
disabled = false
detect_files = ['Chart.yaml', 'helmfile.yaml', 'kustomization.yaml', 'k8s.yaml', 'deployment.yaml']
detect_folders = ['kubernetes', 'k8s', 'helm', 'charts', 'manifests']
detect_extensions = []
# Color based on context - red for prod, green for local
[[kubernetes.contexts]]
context_pattern = 'orbstack'
style = 'green'
symbol = '⎈ '
context_alias = 'local'

[[kubernetes.contexts]]
context_pattern = '.*-cabotage.*'
style = 'bold red'
symbol = '⚠ '

[docker_context]
format = '[🐋 $context](blue bold) [│](dimmed white) '

[java]
symbol = '🌟 '

[nix_shell]
disabled = true
impure_msg = '[impure shell](bold red)'
pure_msg = '[pure shell](bold green)'
unknown_msg = '[unknown shell](bold yellow)'
format = '[☃️ $state( \($name\))](bold blue) '

[bun]
symbol = "🥟 "
format = '[$symbol$version](bold pink) [│](dimmed white) '
detect_files = ["bun.lockb", "bunfig.toml", "bun.lock"]

[nodejs]
format = '[⬢ $version](bold green) [│](dimmed white) '

[package]
format = '[󰏗 $version](208 bold) [│](dimmed white) '

[python]
symbol = '🐍 '
pyenv_version_name = false
detect_files = ['.python-version', 'pyproject.toml', 'uv.lock']
python_binary = ['.venv/bin/python', 'python3', 'python']
format = '[${symbol}${version}( \($virtualenv\))]($style) [│](dimmed white) '

[direnv]
disabled = false
format = '[$symbol$allowed]($style) '
symbol = '  '
style = 'bold yellow'
allowed_msg = ''
not_allowed_msg = '!'
denied_msg = '✗'

[rust]
format = '[🦀 $version](red bold) [│](dimmed white) '

[terraform]
format = '[󱁢 $workspace]($style) '
symbol = '󱁢 '
style = 'bold 105'

[helm]
format = '[⎈ $version]($style) '
style = 'bold white'

# Dexcom glucose + trend: https://github.com/JacobCoffee/dexcom-starship
[custom.dexcom]
command = 'dexcom-starship prompt'
when = 'command -v dexcom-starship >/dev/null'
shell = ['sh']
format = '([$output]($style) [│](dimmed white) )'
style = 'bold 117'
description = 'Dexcom glucose reading'

[custom.mise]
disabled = true
command = 'mise current 2>/dev/null | cut -d" " -f1-2 | tr "\n" " "'
when = 'test -f .mise.toml || test -f mise.toml'
format = '[󱓞 $output]($style)'
style = 'bold blue'
description = 'Current mise tools'

[time]
disabled = false
format = '[$time]($style)'
time_format = '%H:%M'
style = 'dimmed white'

[cmd_duration]
min_time = 2000
format = '[󱎫 $duration]($style) '
style = 'dimmed yellow'
